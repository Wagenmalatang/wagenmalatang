title: WaGen Malatang
email: wagenmalatang@gmail.com
description: >-
  A Japanese-inspired malatang experience — full-bodied broth, freely chosen
  ingredients, and a bowl made with care in every store.
baseurl: ""
url: "https://wagenmalatang.com"

theme: minima
minima:
  skin: auto

header_pages:
  - menu.md
  - our-stores.md
  - join-us.md
  - franchise.md

header_pages_ja:
  - ja/menu.md
  - ja/our-stores.md
  - ja/join-us.md
  - ja/franchise.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
