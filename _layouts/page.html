---
layout: default
---

<div class="page-banner">
  <div class="wrapper">
    {%- if page.eyebrow -%}<div class="page-eyebrow">{{ page.eyebrow }}</div>{%- endif -%}
    <h1 class="page-title">{{ page.title | escape }}</h1>
    {%- if page.subtitle -%}
      <p class="page-subtitle">{{ page.subtitle }}</p>
    {%- endif -%}
  </div>
  {%- if page.banner_mascot -%}
  <img src="{{ page.banner_mascot | relative_url }}" alt="" class="page-banner-mascot" aria-hidden="true">
  {%- endif -%}
</div>

<article class="post">
  <div class="wrapper">
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
